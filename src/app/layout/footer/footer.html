@let smallScreen = isXSmall();
<div class="footer" [class.small-screen]="smallScreen">
  <a routerLink="/">
    <span class="material-symbols-outlined">home</span>
    @if (!smallScreen) {
      <span>Accueil</span>
    }
  </a>
  <a href="mailto:amv.prog@gmail.com">
    <span class="material-symbols-outlined">mail</span>
    @if (!smallScreen) {
      <span>Contact</span>
    }
  </a>
  <div class="version-infos">
    <div>v{{ appVersion() }}</div>
    <a routerLink="/info" title="infos">
      <span class="material-symbols-outlined">info</span>
    </a>
    <a routerLink="/patch-notes" title="patch notes">
      <span class="material-symbols-outlined">article</span>
    </a>
  </div>
</div>
