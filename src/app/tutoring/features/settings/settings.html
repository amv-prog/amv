<div class="page-center section">
  <h1>Gestion des données</h1>

  <form class="simple-form" [formRoot]="settingsForm">
    <div class="field">
      <amv-toggle
        leftLabel="Navigateur"
        rightLabel="Fichier Google"
        [formField]="settingsForm.saveMode"
      ></amv-toggle>
    </div>
  </form>
  @if (settingsFormData().saveMode === 'RIGHT') {
    @if (settings().spreadsheet; as spreadsheet) {
      <div class="subtitle">{{ spreadsheet.name }}</div>
    }

    <div>
      @if (isAuthenticationReady()) {
        <div class="h-panel">
          <amv-google-picker (fileSelected)="selectFile($event)"></amv-google-picker>
          <button (click)="createGoogleSheet()">Créer un nouveau fichier</button>
          @if (!!accessToken()) {
            <button (click)="signOut()">Se déconnecter</button>
          }
        </div>
        <button (click)="renameSheet()">Renommer la feuille</button>
      }
    </div>
  } @else {
    <div class="h-panel">
      <a class="a-button" [href]="sanitizedBlobUrl()" [download]="fileName"
        >Enregistrer les données</a
      >
      <button (click)="fileUpload.click()">Importer un fichier</button>
      <button (click)="validateCleanLocalData()">Supprimer les données</button>
      <button (click)="validateExempleLocalImport()">Importer les données d'exemple</button>
    </div>

    <input type="file" accept=".json" (change)="onFileSelected($event)" #fileUpload />
  }
</div>
