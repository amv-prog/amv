<div class="page-center">
  <h1>
    @if (!!family()) {
      Modifier la famille {{ family()?.name }}
    } @else {
      Ajouter une famille
    }
  </h1>
  <form class="simple-form" [formRoot]="familyForm">
    @let name = familyForm.name;
    <div class="field">
      <label for="fn">Nom *</label>
      <input id="fn" type="text" [formField]="name" />
    </div>
    @if (name().dirty() && name().invalid()) {
      @for (error of name().errors(); track error.kind) {
        <div class="field-error">{{ error.message }}</div>
      }
    }

    <div class="subForm">
      <div class="highlight">Adresse</div>
      <amv-address-form class="simple-form" [addressField]="familyForm.address"></amv-address-form>
    </div>

    <div class="field">
      <label for="info">Informations supplémentaires</label
      ><textarea id="info" [formField]="familyForm.additionalInfo"> </textarea>
    </div>

    <div class="buttons">
      <button [disabled]="familyForm().invalid()">Enregistrer</button>
      <button class="secondary" type="button" (click)="cancel()">Annuler</button>
    </div>
  </form>
</div>
