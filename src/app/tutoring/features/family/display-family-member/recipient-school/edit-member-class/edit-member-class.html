<div class="highlight">Sélectionner la classe</div>
<form class="simple-form" [formRoot]="schoolClassForm">
  <div class="field">
    <label for="school">École</label>
    <select id="school" [formField]="schoolClassForm.schoolId">
      <option value="">-- Sélectionner l'école --</option>
      @for (school of schools(); track school.id) {
        <option [value]="school.id">{{ school.name }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="year">Année scolaire</label>
    <select id="year" [formField]="schoolClassForm.year">
      <option value="">-- Sélectionner l'année --</option>
      @for (year of years(); track year) {
        <option [value]="year.toString()">{{ year }} - {{ year + 1 }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="class">Classe</label>
    <select id="class" [formField]="schoolClassForm.classId">
      <option value="">-- Sélectionner la classe --</option>
      @for (schoolClass of yearClasses(); track schoolClass.id) {
        <option [value]="schoolClass.id">
          {{ schoolClass.grades.join(' / ') }} {{ schoolClass.teachers.join(', ') }}
        </option>
      }
    </select>
  </div>
  <div class="buttons">
    <button class="secondary" type="button" (click)="openAddSchoolDialog()">Créer une école</button>
    <button
      [disabled]="schoolClassForm.schoolId().invalid()"
      class="secondary"
      type="button"
      (click)="openAddClassDialog()"
    >
      Créer une classe
    </button>
  </div>
  <div class="buttons">
    <button [disabled]="schoolClassForm().invalid()">Enregistrer</button>
    <button class="secondary" type="button" (click)="cancel()">Annuler</button>
  </div>
</form>
