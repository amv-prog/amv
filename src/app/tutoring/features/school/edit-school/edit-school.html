<div class="subtitle">
  @if (!!school) {
    Modifier l'école' {{ school.name }}
  } @else {
    Ajouter une école
  }
</div>
<div class="content">
  <form class="simple-form" [formRoot]="schoolForm">
    @let name = schoolForm.name;
    <div class="field">
      <label for="fn">Nom *</label>
      <input id="fn" type="text" [formField]="name" autocomplete="new-name" />
    </div>
    @if (name().dirty() && name().invalid()) {
      @for (error of name().errors(); track error.kind) {
        <div class="field-error">{{ error.message }}</div>
      }
    }

    <div class="field">
      <label for="info">Informations supplémentaires</label
      ><textarea id="info" [formField]="schoolForm.additionalInfo"> </textarea>
    </div>

    <div class="buttons">
      <button [disabled]="schoolForm().invalid()">Enregistrer</button>
      <button class="secondary" type="button" (click)="cancel()">Annuler</button>
    </div>
  </form>
</div>
