<div>
  @if (settings().spreadsheet; as spreadsheet) {
    <div>Données Google</div>
    <div class="bold">{{ spreadsheet.name }}</div>
  } @else {
    <div>Données locales</div>
  }

  @if (dataErrors(); as errors) {
    @for (error of errors; track error) {
      <div class="error">{{ error }}</div>
    }
  }
</div>
